id = "adriankarlen.yeet"
name = "Yeet for Herdr"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Minimal Sesh-style workspace/session manager for Herdr using gum"
platforms = ["linux", "macos"]

[[build]]
command = [
  "go",
  "build",
  "-ldflags=-X=github.com/adriankarlen/yeet/internal/app.Version=0.1.0",
  "-o",
  "bin/",
  "./cmd/yeet",
]

[[startup]]
command = ["./bin/yeet", "plugin", "watch-history"]

[[events]]
on = "workspace.focused"
command = ["./bin/yeet", "plugin", "watch-history"]

[[events]]
on = "workspace.closed"
command = ["./bin/yeet", "plugin", "watch-history"]

[[actions]]
id = "open-picker"
title = "Open Yeet Picker"
contexts = ["workspace", "pane"]
command = ["./bin/yeet", "plugin", "open-picker"]

[[actions]]
id = "last"
title = "Switch to Previous Workspace"
contexts = ["workspace", "pane"]
command = ["./bin/yeet", "last"]

[[panes]]
id = "picker"
title = "Yeet Picker"
placement = "overlay"
command = ["./bin/yeet", "picker"]
